[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-learning"
version = "0.1.0"
description = "Local AI Agent learning demo built around LM Studio"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests>=2.32,<3",
    "openai>=1.40,<2",
    "python-dotenv>=1.0,<2",
    "pypdf>=4,<7",
    "Pillow>=10,<13",
    "gradio>=4.44,<6",
    "ddgs>=6,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[project.scripts]
ai-agent = "main:main"
ai-agent-web = "ai_agent.web_ui:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ai_agent*"]

[tool.pytest.ini_options]
testpaths = ["ai_agent/tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "lf"
